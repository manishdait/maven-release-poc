name: Release Artifacts

# on:
#   workflow_dispatch:
#     inputs:
#       version:
#         description: "Release version"
#         required: true
#       publish:
#         description: "Publish to Maven Central?"
#         required: true
#         default: "false"

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PR_KEY }}" | gpg --batch --import
          
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d'/' -f2)
          echo "KEY_ID=$KEY_ID" >> $GITHUB_ENV

          mkdir -p ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "use-agent" >> ~/.gnupg/gpg.conf

      # - name: Set Maven version
      #   run: ./mvnw -B versions:set versions:commit -DnewVersion=${GITHUB_REF_NAME#v}

      # - name: Commit and Push updated pom.xml
      #   run: |
      #     git config --global user.name "github-actions[bot]"
      #     git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      #     git add .
      #     git commit -s -S -m "chore: bump version to ${GITHUB_REF_NAME#v} [skip ci]"
          
      #     git push origin HEAD:master

      - name: Set Maven version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ./mvnw -B versions:set versions:commit -DnewVersion=$VERSION

      - name: Commit version changes
        uses: planetscale/ghcommit-action@25309d8005ac7c3bcd61d3fe19b69e0fe47dbdde # v0.2.20
        with:
          commit_message: "chore: bump pom version to ${{ env.VERSION }}"
          repo: ${{ github.repository }}
          branch: master
          file_pattern: '**/pom.xml'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Stage (publication profile)
        run: ./mvnw -B -Ppublication deploy

      # Publish using JReleaser
      - name: Publish with JReleaser
        run: ./mvnw -B -Ppublication jreleaser:full-release
        env:
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PR_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ env.KEY_ID }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PARSE }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_TOKEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_TOKEN_PASSWORD }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Skip Publish
      #   if: ${{ github.event.inputs.publish != 'true' }}
      #   run: |
      #     echo "----------------------------------------"
      #     echo "DRY RUN MODE"
      #     echo "Artifacts built and staged locally"
      #     echo "Publishing to Maven Central skipped"
      #     echo "----------------------------------------"
