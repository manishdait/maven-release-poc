name: Release Artifacts

on:
  push:
    tags:
      - "v*.*.*"


# Manual dispatch
# on:
#   workflow_dispatch:
#     inputs:
#       version:
#         description: "Release version"
#         required: true
#       publish:
#         description: "Publish to Maven Central?"
#         required: true
#         default: "false"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PR_KEY }}" | gpg --batch --import
          mkdir -p ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "use-agent" >> ~/.gnupg/gpg.conf

      - name: Set Maven version
        run: ./mvnw -B versions:set versions:commit -DnewVersion=${GITHUB_REF_NAME#v}

      - name: Build & Stage
        run: ./mvnw -B -Ppublication deploy

      - name: Publish with JReleaser
        run: ./mvnw -B -Ppublication jreleaser:full-release -N
        env:
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PR_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PARSE }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_TOKEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_TOKEN_PASSWORD }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish using JReleaser
